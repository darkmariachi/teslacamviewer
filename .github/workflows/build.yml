name: Build desktop app

# Runs by hand (Actions tab, "Run workflow"), for every version tag such as v2.0.0, and for pull requests
# that change the desktop app. A tag also creates a draft release with the installers attached.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - desktop/**
      - .github/workflows/build.yml

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            ffmpeg: win64
            script: dist
          - name: Linux
            os: ubuntu-latest
            ffmpeg: linux64
            script: dist:linux
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix ../web
          npm ci

      # An LGPL build, which can ship with an MIT app. See THIRD_PARTY_NOTICES.md.
      - name: Fetch ffmpeg
        run: node scripts/fetch-ffmpeg.mjs --platform ${{ matrix.ffmpeg }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build installers
        run: npm run ${{ matrix.script }}

      - uses: actions/upload-artifact@v7
        with:
          name: teslacam-viewer-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.tar.gz
            desktop/dist/*.blockmap
            desktop/dist/latest*.yml

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # A draft, so the notes can be written and the files checked before anyone sees it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" artifacts/*
          --repo "${{ github.repository }}"
          --title "TeslaCam Viewer ${{ github.ref_name }}"
          --generate-notes
          --draft
