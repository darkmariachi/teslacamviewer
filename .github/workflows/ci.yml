name: Checks

# Tests and builds for every push to the main branches and every pull request.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test

  web:
    name: Web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  desktop:
    name: Desktop app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  car-logger:
    name: Car logger
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: car-logger
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: car-logger/go.mod
          cache-dependency-path: car-logger/go.sum
      - run: go vet ./...
      - run: go test ./...
      # The Pi is arm64; make sure it still builds for it.
      - run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o /dev/null .
